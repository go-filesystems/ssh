name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    name: test ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Gofmt (files this fork changed; imported files stay as upstream has them)
        run: test -z "$(gofmt -l channel.go common.go handshake.go transport.go flush_test.go)"
      - name: Test (race, corpus replayed, coverage report without a gate)
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - name: Coverage report
        run: go tool cover -func=cover.out | tail -1
      - name: Fuzz smoke
        run: go test -run '^$' -fuzz '^FuzzTransportReadPacket$' -fuzztime 20s .

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true
      # v1.1.4 panics ("unexpected expr: *ast.KeyValueExpr") analysing this
      # tree for linux; v1.9.0 scans it and finds nothing.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
